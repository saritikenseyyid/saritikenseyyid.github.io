---
layout: default
title: Quotes
description: Zitate als Xerox-Poster. Eine Sammlung von Gedanken, die bleiben.
permalink: /quotes/
---
<section class="quote-gallery wrap" aria-label="Zitate als Poster"><div class="gallery-heading"><h1>Quotes<span>*</span></h1><p class="mono">WORDS WORTH KEEPING.</p></div><div class="quote-poster-grid">{% for quote in site.data.quotes %}<figure class="quote-artwork"><button class="quote-artwork-open" data-poster="{{ quote.poster_id | escape }}" aria-label="Zitat von {{ quote.author | escape }} groß ansehen"><img src="{{ quote.image | relative_url }}" alt="{{ quote.text | escape }} — {{ quote.author | escape }}" width="1024" height="1536" {% if forloop.first %}fetchpriority="high"{% else %}loading="lazy"{% endif %} decoding="async"></button></figure>{% endfor %}</div></section>
