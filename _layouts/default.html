<!doctype html>
<html lang="{{ site.lang | default: 'de' }}" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.home %}{{ site.title | escape }} — Persönliches Wiki{% else %}{{ page.title | escape }} — {{ site.title | escape }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}"><meta name="color-scheme" content="light dark">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body{% unless page.home %} class="article-page"{% endunless %} data-search-url="{{ '/search.json' | relative_url }}">
<a class="skip" href="#inhalt">Zum Inhalt springen</a>
{% include header.html %}
<div class="layout">
<div class="navigation-slot"><aside class="leftnav" id="navigation">{% include navigation.html %}</aside></div>
<main id="inhalt"><div class="article-tools"><nav class="tabs" aria-label="Artikelansichten"><a href="#start" class="current">Artikel</a><a href="{{ '/#notizen' | relative_url }}">Notizbuch</a></nav><button id="reading-toggle" aria-pressed="false">Lesemodus ↗</button></div>
{{ content }}
</main>
<aside class="rightnav"><h2>Auf dieser Seite</h2><nav data-toc-list aria-label="Inhaltsverzeichnis"></nav><h2>Erscheinungsbild</h2><div class="settings" data-settings></div><p class="right-foot">Ein bisschen Wikipedia.<br>Ein bisschen ich.</p></aside>
</div>
{% include dialogs.html %}
</body></html>
