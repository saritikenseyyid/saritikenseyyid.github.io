<!doctype html>
<html lang="{{ site.lang | default: 'de' }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eeebe1">
<title>{% if page.home %}{{ site.title | escape }} — A curious work in progress.{% else %}{{ page.title | escape }} — {{ site.title | escape }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head><body>
<a class="skip-link" href="#main">Zum Inhalt</a>
{% include zine-header.html %}
<main id="main">{{ content }}</main>
{% include zine-footer.html %}
{% include zine-dialogs.html %}
</body></html>
